<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/email :: head('Your Soundrate account was deleted')}"></head>
<body style="margin: 0; padding: 0; background: #f4f5f7; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #14181c;">
	<div th:replace="~{fragments/email :: preheader('This confirms that your account was deleted.')}"></div>
	<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background: #f4f5f7;">
		<tr>
			<td align="center" style="padding: 32px 16px;">
				<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
					style="max-width: 560px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px;">
					<tr th:replace="~{fragments/email :: header}"></tr>
					<tr>
						<td style="padding: 32px; font-size: 16px; line-height: 1.6;">
							<h1 style="margin: 0 0 16px; font-size: 24px; line-height: 1.3;">Your account was deleted</h1>
							<p style="margin: 0 0 12px;">Hi <strong th:text="${username}">listener</strong>,</p>
							<p style="margin: 0 0 20px;">This confirms that your Soundrate account was deleted as you requested. You can no longer sign in with it, and your profile is no longer visible.</p>
							<p style="margin: 0; color: #4b5563; font-size: 14px;">Thanks for being part of the community.</p>
						</td>
					</tr>
					<tr th:replace="~{fragments/email :: footer('You received this email because your account was deleted.')}"></tr>
				</table>
			</td>
		</tr>
	</table>
</body>
</html>
