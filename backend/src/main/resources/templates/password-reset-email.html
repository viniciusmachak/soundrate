<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password</title>
</head>
<body style="margin: 0; padding: 32px 16px; background: #ffffff; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #14181c; line-height: 1.5;">
	<div style="max-width: 480px; margin: 0 auto;">
		<p style="margin: 0 0 32px; font-weight: 700; font-size: 18px;">Soundrate</p>
		<p style="margin: 0 0 16px;">Hi <span th:text="${username}">listener</span>,</p>
		<p style="margin: 0 0 24px;">We received a request to reset your password. This link is valid for 1 hour.</p>
		<p style="margin: 0 0 24px;">
			<a th:href="${resetLink}" href="#"
				style="display: inline-block; padding: 12px 20px; background: #7066ff; color: #ffffff; text-decoration: none; border-radius: 4px; font-weight: 600;">Reset password</a>
		</p>
		<p style="margin: 0 0 8px; font-size: 13px; color: #6b7280;">Or paste this link into your browser:</p>
		<p style="margin: 0 0 32px; font-size: 13px; word-break: break-all;"><a th:href="${resetLink}" th:text="${resetLink}" href="#" style="color: #7066ff;">link</a></p>
		<p style="margin: 0; font-size: 13px; color: #6b7280;">If you didn't ask for this, you can ignore this email.</p>
	</div>
</body>
</html>
