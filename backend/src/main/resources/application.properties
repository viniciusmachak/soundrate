spring.application.name=sound-rate
server.port=8080
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.profiles.default=local

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:4200}

jwt.issuer=sound-rate-api
jwt.secret=${JWT_SECRET}

cloudinary.url=${CLOUDINARY_URL}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:no-reply@localhost}
