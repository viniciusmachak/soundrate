spring.application.name=sound-rate
server.port=8080
# Trust X-Forwarded-For from the internal proxies (Caddy, nginx) so rate limits see the real client IP.
server.forward-headers-strategy=native
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.profiles.default=local

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}

spring.jpa.hibernate.ddl-auto=validate

# Schema is owned by Flyway (src/main/resources/db/migration).
# Existing databases created by Hibernate are baselined at V1 instead of re-running it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:4200}

jwt.issuer=sound-rate-api
jwt.secret=${JWT_SECRET}

cloudinary.url=${CLOUDINARY_URL}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:no-reply@localhost}
# Production sets MAIL_REQUIRED=true so a missing MAIL_HOST fails at startup.
app.mail.required=${MAIL_REQUIRED:false}

# Avatar uploads: keep in sync with client_max_body_size in frontend/nginx.conf.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Health check for Docker; only reachable inside the Compose network (nginx proxies /api/v1 only).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
