<section class="page not-found" aria-labelledby="not-found-title">
  <img src="/logo-96.png" alt="" width="64" height="64" class="not-found-logo">
  <p class="not-found-code">{{ 'notFound.code' | t }}</p>
  <h1 id="not-found-title">{{ titleKey() | t }}</h1>
  <p class="not-found-copy">{{ copyKey() | t }}</p>
  <a mat-flat-button routerLink="/">{{ 'notFound.goHome' | t }}</a>
</section>
