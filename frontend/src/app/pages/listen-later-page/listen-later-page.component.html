<div class="page">
  <h1>Listen later</h1>
  <p class="muted subtitle">Albums you saved to explore.</p>

  @if (isLoading) {
    <app-skeleton-loader variant="cards" [count]="12" />
  } @else {
    @if ((albums$ | async); as albums) {
      <ul class="poster-grid">
        @for (album of albums; track album.id) {
          <li><app-album-card [album]="album" /></li>
        } @empty {
          <li class="empty-state grid-empty">Your Listen later list is empty.</li>
        }
      </ul>
    }
    @if (totalAlbums > pageSize) {
      <mat-paginator [length]="totalAlbums" [pageSize]="pageSize"
        [pageIndex]="currentPage" (page)="onPageChange($event)">
      </mat-paginator>
    }
  }
</div>
