<h2 mat-dialog-title>{{ 'shared.reviewFor' | t: { title: data.albumTitle } }}</h2>
<mat-dialog-content>
    <p style="white-space: pre-wrap;">{{ data.reviewText }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>{{ 'common.close' | t }}</button>
</mat-dialog-actions>
