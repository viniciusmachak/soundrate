<a class="poster" [routerLink]="['/album', id]" [title]="title + ' — ' + artistName">
  <img [src]="coverUrl" [alt]="'Cover of ' + title" class="poster-cover" loading="lazy">
  <span class="poster-title">{{ title }}</span>
  <span class="poster-subtitle">
    {{ artistName }}
    @if (averageRating) {
      <span class="poster-rating" [attr.aria-label]="averageRating + ' out of 5 stars'">★ {{ averageRating | number:'1.1-1' }}</span>
    }
  </span>
</a>
