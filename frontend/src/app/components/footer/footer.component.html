<footer class="footer">
  <div class="footer-container">
    <div class="footer-main">
      <div class="footer-brand">
        <a routerLink="/" class="footer-logo"><img src="/logo-96.png" alt="" width="32" height="32" class="brand-logo"><span>Soundrate</span></a>
        <p>{{ 'layout.tagline' | t }}</p>
      </div>

      <nav class="footer-navigation" [attr.aria-label]="'layout.footerNavigation' | t">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">{{ 'common.home' | t }}</a>
        <a routerLink="/about" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'common.about' | t }}</a>
        <a routerLink="/listen-later" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'common.listenLater' | t }}</a>
        <a routerLink="/privacy" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'layout.privacy' | t }}</a>
        <a href="https://www.deezer.com/" target="_blank" rel="noopener noreferrer">Deezer</a>
        <a
          href="https://github.com/viniciusmachak/sound-rate"
          target="_blank"
          rel="noopener noreferrer"
          >{{ 'layout.code' | t }}</a
        >
      </nav>

      <div class="social-links" [attr.aria-label]="'layout.socialLinks' | t">
        <a
          href="https://github.com/viniciusmachak"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'layout.developerGithub' | t"
          title="GitHub"
        >
          <svg class="social-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
        </a>
        <a
          href="https://www.instagram.com/vinicabr4l/"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'layout.developerInstagram' | t"
          title="Instagram"
        >
          <svg
            class="social-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
          </svg>
        </a>
      </div>
    </div>

    <div class="footer-bottom">
      <p>{{ 'layout.copyright' | t: { year: currentYearLabel } }}</p>
      <p>{{ 'layout.dataProvider' | t }}</p>
      <app-language-switcher variant="full" class="footer-language" />
    </div>
  </div>
</footer>
