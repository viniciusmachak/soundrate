<footer class="footer">
  <div class="footer-container">
    <div class="footer-main">
      <div class="footer-brand">
        <a routerLink="/" class="footer-logo"><img src="/logo-96.png" alt="" width="32" height="32" class="brand-logo"><span>Soundrate</span></a>
        <p>{{ 'layout.tagline' | t }}</p>
      </div>

      <nav class="footer-navigation" [attr.aria-label]="'layout.footerNavigation' | t">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">{{ 'common.home' | t }}</a>
        <a routerLink="/about" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'common.about' | t }}</a>
        <a routerLink="/listen-later" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'common.listenLater' | t }}</a>
        <a routerLink="/privacy" routerLinkActive="active" ariaCurrentWhenActive="page">{{ 'layout.privacy' | t }}</a>
        <a href="https://www.deezer.com/" target="_blank" rel="noopener noreferrer">Deezer</a>
        <a
          href="https://github.com/viniciusmachak/sound-rate"
          target="_blank"
          rel="noopener noreferrer"
          >{{ 'layout.code' | t }}</a
        >
      </nav>

      <div class="social-links" [attr.aria-label]="'layout.socialLinks' | t">
        <a
          href="https://github.com/viniciusmachak"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'layout.developerGithub' | t"
          title="GitHub"
        >
          <i class="fab fa-github" aria-hidden="true"></i>
        </a>
        <a
          href="https://www.instagram.com/vinicabr4l/"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'layout.developerInstagram' | t"
          title="Instagram"
        >
          <i class="fab fa-instagram" aria-hidden="true"></i>
        </a>
      </div>
    </div>

    <div class="footer-bottom">
      <p>{{ 'layout.copyright' | t: { year: currentYearLabel } }}</p>
      <p>{{ 'layout.dataProvider' | t }}</p>
      <app-language-switcher variant="full" class="footer-language" />
    </div>
  </div>
</footer>
