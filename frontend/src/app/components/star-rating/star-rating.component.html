@let accessibleLabel = label || ('shared.rating' | t);
@if (readonly) {
  <div class="star-container readonly-stars" role="img"
    [attr.aria-label]="'shared.ratingValue' | t: { label: accessibleLabel, rating: rating }">
    @for (star of stars; track star) {
      <mat-icon class="star-icon-display" aria-hidden="true">{{ getStarIcon(star) }}</mat-icon>
    }
  </div>
} @else {
  <div class="star-container interactive-stars" role="slider" tabindex="0"
    [attr.aria-label]="accessibleLabel"
    aria-valuemin="0" aria-valuemax="5"
    [attr.aria-valuenow]="rating"
    [attr.aria-valuetext]="'shared.ratingOutOfFive' | t: { rating: rating }"
    (keydown)="handleKeydown($event)" (mouseleave)="clearHoverRating()">
    @for (star of stars; track star) {
      <span class="star-hit-target" aria-hidden="true"
        (click)="rate(star, $event)" (mousemove)="setHoverRating(star, $event)">
        <mat-icon aria-hidden="true">{{ getStarIcon(star) }}</mat-icon>
      </span>
    }
  </div>
}
