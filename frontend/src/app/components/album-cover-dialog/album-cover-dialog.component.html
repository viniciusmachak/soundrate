<figure class="cover-dialog">
  <button mat-icon-button mat-dialog-close class="close-button" [attr.aria-label]="'shared.closeAlbumCover' | t">
    <mat-icon>close</mat-icon>
  </button>

  <img width="1000" height="1000" [src]="data.imageUrl" [alt]="'album.coverOf' | t: { title: data.title }" />

  <figcaption>
    <strong>{{ data.title }}</strong>
    @if (data.artistName) {
      <span>{{ data.artistName }}</span>
    }
  </figcaption>
</figure>
