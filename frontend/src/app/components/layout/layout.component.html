<a class="skip-link" href="#main-content">{{ 'layout.skipToContent' | t }}</a>

<app-header />

<main id="main-content" class="main-content" [class.home-route]="isHomePage" tabindex="-1">
  <router-outlet></router-outlet>
</main>

<app-footer />

@if (showBackToTop) {
  <button class="back-to-top" type="button" [attr.aria-label]="'layout.backToTop' | t" [title]="'layout.backToTop' | t"
    (click)="scrollToTop()">
    <span class="material-icons" aria-hidden="true">arrow_upward</span>
  </button>
}
