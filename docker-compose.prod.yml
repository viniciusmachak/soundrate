# Production override: run with
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Caddy terminates HTTPS for $DOMAIN; backend, frontend and Umami are only reachable through it.
services:
  backend:
    ports: !reset []
    environment:
      APP_FRONTEND_URL: https://${DOMAIN}
      APP_CORS_ORIGINS: https://${DOMAIN}
      MAIL_REQUIRED: "true"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60

  frontend:
    ports: !reset []

  # Umami web analytics: dashboard at https://analytics.$DOMAIN.
  # Stores its tables in the "umami" schema of the app database, so backups include them.
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    container_name: soundrate_umami
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env}
      TRACKER_SCRIPT_NAME: stats.js
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2.10.2-alpine
    container_name: soundrate_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - umami

volumes:
  caddy_data:
  caddy_config:
